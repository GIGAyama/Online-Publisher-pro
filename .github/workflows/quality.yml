# GIGA Standard v4 の品質ゲート。
#
# ライブラリを自己ホストにしたので、npm ci が要る。
# npm run check は tools/build.mjs（@babel/core を使う）を通るため、
# 依存を入れずに走らせると ERR_MODULE_NOT_FOUND で落ちる。
name: quality

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: ライブラリを版どおりに入れる
        run: npm ci

      - name: 品質ゲート
        run: npm run check

      - name: SW の版がずれていないか
        run: node tools/build-sw.mjs --check

  # 正本（GIGAyama.github.io/standards/）からコピーしたファイルが、
  # 正本の更新に取り残されていないかを見る。standards-map.json が対応表。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
