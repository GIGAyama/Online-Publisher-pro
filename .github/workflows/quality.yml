# GIGA Standard v4 の品質ゲート。
# 依存パッケージが無いので npm ci は不要。node だけで走る。
name: quality

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 品質ゲート
        run: npm run check

      - name: SW の版がずれていないか
        run: node tools/build-sw.mjs --check

  # 正本（GIGAyama.github.io/standards/）からコピーしたファイルが、
  # 正本の更新に取り残されていないかを見る。standards-map.json が対応表。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
