  <script>
    /*
     * ソフトキーボードが出たときの高さ合わせ。
     * iOS Safari はキーボードが出ても window.innerHeight（=100dvh）が変わらないため、
     * 原稿用紙の入力欄がキーボードの下に隠れて「書いている行が見えない」状態になる。
     * 実際に見えている高さ（visualViewport.height）を --vvh に流し込んで解決する。
     *
     * ピンチで拡大しているとき（scale > 1）は visualViewport が「拡大された一部」を
     * 指すので追随させない。追随させると画面が勝手に縮んで読めなくなる。
     */
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var root = document.documentElement;
      var sync = function () {
        if (vv.scale > 1.01) { root.style.removeProperty('--vvh'); return; }
        root.style.setProperty('--vvh', vv.height + 'px');
      };
      vv.addEventListener('resize', sync);
      vv.addEventListener('scroll', sync);
      sync();
    })();
  </script>

  <!--
