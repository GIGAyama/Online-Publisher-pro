<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f97316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="出版社Pro">
  <title>オンライン出版社 Pro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", sans-serif;
      background: #fff7ed;
      color: #1e293b;
      height: 100vh;
    }
    @supports (height: 100dvh) { body { height: 100dvh; } }

    /* ===== アプリ表示 ===== */
    #app-frame {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
    }
    body.app-mode #app-frame { display: block; }
    body.app-mode #setup { display: none; }

    /* ===== 初回セットアップ画面 ===== */
    #setup {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 20px;
      overflow-y: auto;
    }
    .logo {
      width: 88px; height: 88px; border-radius: 24px;
      box-shadow: 0 8px 20px rgba(249, 115, 22, .3);
    }
    h1 { font-size: 1.4rem; color: #c2410c; letter-spacing: .05em; text-align: center; }
    .card {
      background: #fff;
      border: 1px solid #fed7aa;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
      display: flex; flex-direction: column; gap: 14px;
    }
    .card p { font-size: .9rem; line-height: 1.7; color: #475569; }
    .card label { font-weight: bold; font-size: .9rem; color: #334155; }
    .card input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
    }
    .card input:focus { border-color: #fb923c; box-shadow: 0 0 0 3px rgba(251, 146, 60, .2); }
    .card button {
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(to right, #f97316, #fb923c);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(249, 115, 22, .35);
    }
    .card button:active { transform: scale(.97); }
    .error { color: #e11d48; font-size: .85rem; font-weight: bold; display: none; }
    .hint { font-size: .78rem; color: #94a3b8; line-height: 1.7; }
    #install-btn {
      display: none;
      background: #059669;
      box-shadow: 0 4px 10px rgba(5, 150, 105, .35);
    }
    #change-url {
      position: fixed;
      right: 8px; bottom: 8px;
      z-index: 10;
      font-size: 11px;
      color: #94a3b8;
      background: rgba(255,255,255,.8);
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
      display: none;
    }
    body.app-mode #change-url { display: block; }
  </style>
</head>
<body>
  <div id="setup">
    <img class="logo" src="icons/icon-192.png" alt="オンライン出版社 Pro">
    <h1>オンライン出版社 Pro</h1>
    <div class="card">
      <p>はじめに、先生から教えてもらった<br><strong>アプリのURL（Google Apps ScriptのウェブアプリURL）</strong>を入力してください。<br>入力は最初の1回だけです。</p>
      <label for="gas-url">アプリのURL</label>
      <input id="gas-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      <div class="error" id="url-error">URLが正しくありません。「https://script.google.com/」から始まるURLを入力してください。</div>
      <button id="start-btn">アプリをはじめる</button>
      <button id="install-btn">📲 アプリとしてインストール</button>
      <p class="hint">
        ※ このページをホーム画面やシェルフに追加（インストール）すると、次回からアプリのように起動できます。<br>
        ※ URLをまちがえたときは、アプリ右下の「URLを変える」から入力しなおせます。
      </p>
    </div>
  </div>

  <iframe id="app-frame" title="オンライン出版社 Pro" allow="clipboard-write"></iframe>
  <button id="change-url" type="button">URLを変える</button>

  <script>
    (function () {
      const STORAGE_KEY = 'opp_gas_url';
      const frame = document.getElementById('app-frame');
      const input = document.getElementById('gas-url');
      const urlError = document.getElementById('url-error');

      const isValidGasUrl = (url) => {
        try {
          const u = new URL(url);
          return u.protocol === 'https:' &&
                 (u.hostname === 'script.google.com' || u.hostname.endsWith('.googleusercontent.com'));
        } catch (e) { return false; }
      };

      const launch = (url) => {
        frame.src = url;
        document.body.classList.add('app-mode');
      };

      // ?app=<GASのURL> で起動された場合は保存して起動（先生が配布するリンク用）
      const params = new URLSearchParams(location.search);
      const fromParam = params.get('app');
      if (fromParam && isValidGasUrl(fromParam)) {
        localStorage.setItem(STORAGE_KEY, fromParam);
        history.replaceState(null, '', location.pathname);
      }

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && isValidGasUrl(saved)) {
        launch(saved);
      } else if (saved) {
        localStorage.removeItem(STORAGE_KEY);
      }

      document.getElementById('start-btn').addEventListener('click', () => {
        const url = input.value.trim();
        if (!isValidGasUrl(url)) { urlError.style.display = 'block'; return; }
        urlError.style.display = 'none';
        localStorage.setItem(STORAGE_KEY, url);
        launch(url);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('start-btn').click();
      });

      document.getElementById('change-url').addEventListener('click', () => {
        if (confirm('アプリのURLを入力しなおしますか？')) {
          localStorage.removeItem(STORAGE_KEY);
          location.reload();
        }
      });

      // Chromeのインストールプロンプト対応
      let deferredPrompt = null;
      const installBtn = document.getElementById('install-btn');
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
      });
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.style.display = 'none';
      });
      window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });

      // Service Worker 登録（file:// で開いたときはスキップ）
      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
